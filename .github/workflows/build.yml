name: Build Promax Wizard IPK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev gawk libssl-dev distcc python3 python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Download OpenWrt SDK (x86/64 Generic)
        run: |
          wget https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xf openwrt-sdk-*.tar.xz
          mv openwrt-sdk-* openwrt-sdk
          
      - name: Build Package
        run: |
          mkdir -p openwrt-sdk/package/promax-wizard
          cp -r Makefile root openwrt-sdk/package/promax-wizard/
          
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make package/promax-wizard/compile V=s

      - name: Organize and Upload IPK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: PROMAX-IPK-v1
          files: |
            openwrt-sdk/bin/packages/**/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

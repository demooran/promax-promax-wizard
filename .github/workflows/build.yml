name: Build OpenWrt IPK Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk libssl-dev wget unzip python3 python3-pip rsync git zlib1g-dev swig libelf-dev

      - name: Clone OpenWrt Source
        run: |
          git clone --branch openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Custom Wizard Package
        run: |
          if [ -d luci-app-promax-wizard ]; then
            cp -r luci-app-promax-wizard openwrt/package/
          fi

      - name: Compile Only IPK Package
        run: |
          cd openwrt
          make defconfig
          # تجهيز الأدوات والـ Toolchain أولاً لمنع حدوث خطأ الفشل
          make tools/compile -j$(nproc)
          make toolchain/compile -j$(nproc)
          # تجميع الحزمة الخاصة بك بنجاح
          make package/luci-app-promax-wizard/compile V=s

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: promax-wizard-ipk
          path: openwrt/bin/packages/**/*.ipk

      - name: Organize and Release IPK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: PROMAX-IPK-v1
          files: openwrt/bin/packages/**/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
